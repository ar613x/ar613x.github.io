<!DOCTYPE html>
<html>
<head>
<style>
body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px;
}

#board {
    display: grid;
    grid-template-columns: repeat(19, 30px);
    grid-template-rows: repeat(19, 30px);
}

.cell {
    width: 30px;
    height: 30px;
    border: 1px solid black;
    background: burlywood;
    position: relative;
    box-sizing: border-box;
}

.last-move {
    background: light-purple;
}

.stone {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    position: absolute;
    top: 2px;
    left: 2px;
}

.black {
    background: radial-gradient(black, rgb(75, 75, 75));
    border: 1px solid white;
}

.white {
    background: radial-gradient(white, rgb(205, 205, 205));
    border: 1px solid black;
}
    
</style>
</head>
<body>

<div id="board"></div>

<script>
const board = document.getElementById("board");

let lastCell = null;

function markLastMove(cell) {
    if (lastCell) {
        lastCell.classList.remove("last-move");
    }

    cell.classList.add("last-move");
    lastCell = cell;
}

for (let i = 0; i < 19 * 19; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";

    let clickTimer = null;

    cell.addEventListener("click", () => {
        clearTimeout(clickTimer);

        clickTimer = setTimeout(() => {
            const stone = cell.querySelector(".stone");

            // Remove existing stone
            if (stone) {
                stone.remove();

                if (cell === lastCell) {
                    cell.classList.remove("last-move");
                    lastCell = null;
                }

                return;
            }

            // Place black stone
            const s = document.createElement("div");
            s.className = "stone black";
            cell.appendChild(s);

            markLastMove(cell);
        }, 200);
    });

    cell.addEventListener("dblclick", () => {
        clearTimeout(clickTimer);

        if (cell.querySelector(".stone")) return;

        const s = document.createElement("div");
        s.className = "stone white";
        cell.appendChild(s);

        markLastMove(cell);
    });

    board.appendChild(cell);
}
</script>

</body>
</html>
