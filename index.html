<!DOCTYPE html>
<html>
<head>
<style>
body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px;
}

#board {
    display: grid;
    grid-template-columns: repeat(19, 30px);
    grid-template-rows: repeat(19, 30px);
}

.cell {
    width: 30px;
    height: 30px;
    border: 1px solid black;
    background: burlywood;
    position: relative;
    box-sizing: border-box;
}

.last-move {
    background: #34cceb;
}

.stone {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.black {
    background: radial-gradient(rgb(75,75,75), black);
    border: 1px solid white;
}

.white {
    background: radial-gradient(white, rgb(205,205,205));
    border: 1px solid black;
}

/* Center 3×3 outline */
.center-top {
    border-top: 3px solid red !important;
}

.center-bottom {
    border-bottom: 3px solid red !important;
}

.center-left {
    border-left: 3px solid red !important;
}

.center-right {
    border-right: 3px solid red !important;
}
</style>
</head>
<body>

<div id="board"></div>

<script>
const board = document.getElementById("board");

let lastCell = null;

function markLastMove(cell) {
    if (lastCell) {
        lastCell.classList.remove("last-move");
    }

    cell.classList.add("last-move");
    lastCell = cell;
}

for (let i = 0; i < 19 * 19; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";

    const row = Math.floor(i / 19);
    const col = i % 19;

    // Outline the center 3×3 area
    if (row >= 8 && row <= 10) {
        if (col === 8) cell.classList.add("center-left");
        if (col === 10) cell.classList.add("center-right");
    }

    if (col >= 8 && col <= 10) {
        if (row === 8) cell.classList.add("center-top");
        if (row === 10) cell.classList.add("center-bottom");
    }

    let clickTimer = null;

    // Single click = black stone OR remove stone
    cell.addEventListener("click", () => {
        clearTimeout(clickTimer);

        clickTimer = setTimeout(() => {
            const stone = cell.querySelector(".stone");

            if (stone) {
                stone.remove();

                if (cell === lastCell) {
                    cell.classList.remove("last-move");
                    lastCell = null;
                }

                return;
            }

            const s = document.createElement("div");
            s.className = "stone black";
            cell.appendChild(s);

            markLastMove(cell);
        }, 200);
    });

    // Double click = white stone
    cell.addEventListener("dblclick", () => {
        clearTimeout(clickTimer);

        if (cell.querySelector(".stone")) return;

        const s = document.createElement("div");
        s.className = "stone white";
        cell.appendChild(s);

        markLastMove(cell);
    });

    board.appendChild(cell);
}
</script>

</body>
</html>
